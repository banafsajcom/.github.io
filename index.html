<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر بنفسج | Banafsaj Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6B2D7B; --primary-dark: #4A1C55;
      --bg: #F8F5FA; --card: #FFFFFF; --text: #2D1B36; --border: #E8DFF0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--primary-dark); color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; font-weight: bold; }
    .hero { background: var(--primary); color: #fff; padding: 2rem; text-align: center; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 250px; object-fit: cover; }
    .product-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .product-title { font-weight: bold; margin-bottom: 0.5rem; height: 3rem; overflow: hidden; font-size: 0.9rem; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .product-price { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="logo">💜 متجر بنفسج</div>
  </header>

  <section class="hero">
    <h1>أهلاً بك في متجر بنفسج</h1>
    <p>أزياء • إلكترونيات • إكسسوارات</p>
  </section>

  <main class="container">
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <script>
    // كود التتبع الخاص بك
    const AFFILIATE_TRACKING = "ismg_ol=FgiHU90Jmtk_01_KOC-C";

    // المنتجات (مدمجة هنا لضمان العمل 100%)
    const myProducts = [
      {"id":1,"name_ar":"حافظة هاتف لامعة ممتازة","price":3.07,"image":"https://img.ltwebstatic.com/v4/j/spmp/2026/05/10/42/1778407380ebe347ac45dbea26bf5f4bd76c9bdc2c_square_thumbnail_405x552.jpg","url":"https://www.shein.co.uk/2-In-1-Glossy-Premium-Texture-Phone-Case-Scratch-Resistant-Compatible-With-IPhone-11-12-13-14-15-16-17series-Galaxy-S25-S24-S23-S22-S21-FE-Plus-Anti-Yellowing-Skin-Friendly-Material-Cute-Stylish-For-Everyday-Aesthetics-Perfect-For-Everyday-Carry--p-465718373.html"},
      {"id":2,"name_ar":"حامل هاتف للسيارة للمقعد الخلفي","price":3.68,"image":"https://img.ltwebstatic.com/v4/j/spmp/2026/05/05/d5/1777953602172f47c79fd94a1ff6b562806df9b89a_square_thumbnail_405x552.jpg","url":"https://www.shein.co.uk/Car-Backseat-Phone-Holder-Headrest-Mount-Phone-Bracket-360-Rotatable-Adjustable-Multi-Function-Phone-Stand-p-460347916.html"},
      {"id":3,"name_ar":"حامل هاتف مغناطيسي متعدد الوظائف","price":3.58,"image":"https://img.ltwebstatic.com/v4/j/spmp/2026/09/18/47/1789709208ee99864d4948af5b5b743af40421e7e5_thumbnail_405x552.png","url":"https://www.shein.co.uk/Multifunctional-Magnetic-Car-Phone-Holder-Adjustable-Suction-Cup-Phone-Base-Foldable-360-Rotating-Phone-Stand-With-Mechanical-Vacuum-Suction-Cup-Easy-Installation-Portable-Supports-360-Rotation-Strong-Magnetic-Adsorption-Universal-Phone-Holder-Suitable-For-Car-Dashboard-And-Windshield-For-Car-Interior-Or-Home-Use-Perfect-Gift-Choice-p-568046334.html"},
      {"id":4,"name_ar":"حافظة آيباد مضادة للسقوط","price":5.27,"image":"http://img.ltwebstatic.com/images3_pi/2022/04/22/16505926464e20bbfc6f502f917e282b92cbcc077a_thumbnail_405x552.jpg","url":"https://www.shein.co.uk/Colorblock-Anti-fall-Case-Compatible-With-iPad-p-10364489.html"},
      {"id":5,"name_ar":"حافظة سامسونج تاب S6","price":12.43,"image":"http://img.ltwebstatic.com/images3_spmp/2024/02/26/6c/17089310775e30e65411ff09bd231c2822d8b8a496_thumbnail_405x552.jpg","url":"https://www.shein.co.uk/Case-Compatible-With-Samsung-Tab-S6-Lite-10-4-P620-P625-Tab-S7-Plus-12-4-Tab-S8-Plus-12-4-Multi-Angle-Stand-Cover-Transparent-Back-Tablet-Slim-Cover-Support-Auto-Sleep-Wake-p-30149516.html"}
    ];

    // دالة العرض
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      
      grid.innerHTML = myProducts.map(p => {
        // إضافة كود التتبع للرابط
        let finalUrl = p.url;
        if (!finalUrl.includes(AFFILIATE_TRACKING)) {
            finalUrl = finalUrl + (finalUrl.includes('?') ? '&' : '?') + AFFILIATE_TRACKING;
        }

        return `
          <div class="product-card">
            <img class="product-img" src="${p.image}" loading="lazy" onerror="this.src='https://placehold.co/250x250?text=Banafsaj'">
            <div class="product-body">
              <div class="product-title">${p.name_ar}</div>
              <div class="product-footer">
                <div class="product-price">$${p.price}</div>
                <a href="${finalUrl}" target="_blank" style="text-decoration:none;">
                  <button class="btn">اشتري الآن</button>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // تشغيل الدالة عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', renderProducts);
  </script>
</body>
</html>

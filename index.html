<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر بنفسج | Banafsaj Store</title>
  <meta name="description" content="متجر بنفسج - تسوق أزياء، إلكترونيات، عطور وتجميل وإكسسوارات للرجال والنساء بأسعار مميزة" />
  <meta name="theme-color" content="#6B2D7B" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #6B2D7B;
      --primary-dark: #4A1C55;
      --primary-light: #9B4DB0;
      --accent: #C77DFF;
      --bg: #F8F5FA;
      --card: #FFFFFF;
      --text: #2D1B36;
      --text-light: #6B5B73;
      --border: #E8DFF0;
      --danger: #C62828;
      --shadow: 0 4px 24px rgba(107, 45, 123, 0.09);
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 0.75rem 1.2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 1.45rem;
      font-weight: 800;
      text-decoration: none;
      color: #fff;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .search-box { flex: 1; min-width: 180px; max-width: 460px; position: relative; }
    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.7rem;
      border: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.96);
      color: var(--text);
      outline: none;
    }
    .search-box input:focus { box-shadow: 0 0 0 3px rgba(199,125,255,0.45); }
    .search-box .icon {
      position: absolute; right: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--primary); pointer-events: none;
    }
    .header-actions { display: flex; align-items: center; gap: 0.7rem; }
    .lang-btn, .cart-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 0.5rem 0.95rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex; align-items: center; gap: 0.35rem;
      transition: background 0.2s;
    }
    .lang-btn:hover, .cart-btn:hover { background: rgba(255,255,255,0.28); }
    .cart-btn { position: relative; }
    .cart-count {
      position: absolute; top: -7px; left: -7px;
      background: #FF4081; color: #fff;
      font-size: 0.68rem; font-weight: 700;
      width: 19px; height: 19px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .hero {
      background: linear-gradient(135deg, #8B3A9B 0%, #5A1F6A 100%);
      color: #fff;
      padding: 2.2rem 1.2rem;
      text-align: center;
    }
    .hero h1 { font-size: clamp(1.5rem, 4vw, 2.3rem); font-weight: 800; margin-bottom: 0.4rem; }
    .hero p { opacity: 0.92; font-size: 1.02rem; max-width: 580px; margin: 0 auto; }
    .categories {
      max-width: 1280px; margin: 1.4rem auto 0; padding: 0 1.2rem;
      display: flex; gap: 0.55rem; overflow-x: auto; padding-bottom: 0.4rem;
    }
    .cat-btn {
      flex-shrink: 0;
      padding: 0.5rem 1.15rem;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 1.4rem 1.2rem 3.5rem; }
    .section-title {
      font-size: 1.35rem; font-weight: 700; margin-bottom: 1.1rem;
      color: var(--primary-dark); display: flex; align-items: center; gap: 0.45rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.3rem;
    }
    .product-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.25s, box-shadow 0.25s;
      display: flex; flex-direction: column;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 32px rgba(107,45,123,0.14);
    }
    .product-img {
      width: 100%; height: 230px; object-fit: cover;
      background: #f0e6f5; display: block;
    }
    .product-body {
      padding: 0.95rem 1.05rem 1.15rem;
      display: flex; flex-direction: column; flex: 1;
    }
    .product-cat {
      font-size: 0.72rem; color: var(--primary-light);
      font-weight: 600; margin-bottom: 0.25rem; letter-spacing: 0.3px;
    }
    .product-title {
      font-size: 0.98rem; font-weight: 700; margin-bottom: 0.35rem;
      line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .product-desc {
      font-size: 0.82rem; color: var(--text-light); margin-bottom: 0.75rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      flex: 1;
    }
    .product-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-top: auto;
    }
    .product-price {
      font-size: 1.12rem; font-weight: 800; color: var(--primary);
    }
    .btn-add {
      background: var(--primary); color: #fff; border: none;
      padding: 0.5rem 0.9rem; border-radius: 50px;
      font-family: inherit; font-weight: 600; font-size: 0.82rem;
      cursor: pointer; transition: background 0.2s, transform 0.15s; white-space: nowrap;
    }
    .btn-add:hover { background: var(--primary-dark); transform: scale(1.03); }
    .btn-add:active { transform: scale(0.97); }
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.48);
      z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s;
    }
    .cart-overlay.open { opacity: 1; visibility: visible; }
    .cart-sidebar {
      position: fixed; top: 0; left: 0;
      width: min(400px, 93vw); height: 100%;
      background: #fff; z-index: 2001;
      transform: translateX(-100%); transition: transform 0.3s ease;
      display: flex; flex-direction: column;
      box-shadow: 8px 0 30px rgba(0,0,0,0.12);
    }
    [dir="ltr"] .cart-sidebar { left: auto; right: 0; transform: translateX(100%); }
    .cart-overlay.open .cart-sidebar { transform: translateX(0); }
    .cart-header {
      padding: 1.15rem 1.35rem; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-header h2 { font-size: 1.15rem; font-weight: 700; }
    .close-cart { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; line-height: 1; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
    .cart-empty { text-align: center; padding: 3rem 1rem; color: var(--text-light); }
    .cart-item {
      display: flex; gap: 0.85rem; padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item img { width: 68px; height: 68px; object-fit: cover; border-radius: 10px; background: #f0e6f5; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-title {
      font-weight: 600; font-size: 0.88rem; margin-bottom: 0.2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cart-item-price { color: var(--primary); font-weight: 700; font-size: 0.92rem; }
    .cart-item-actions { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.35rem; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--border); background: #fff;
      cursor: pointer; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: var(--bg); }
    .remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.78rem; margin-right: auto; }
    .cart-footer { padding: 1.15rem 1.35rem; border-top: 1px solid var(--border); background: #faf8fc; }
    .cart-total { display: flex; justify-content: space-between; font-size: 1.12rem; font-weight: 700; margin-bottom: 0.9rem; }
    .btn-checkout {
      width: 100%; padding: 0.85rem; background: var(--primary); color: #fff;
      border: none; border-radius: 50px; font-family: inherit;
      font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-checkout:hover { background: var(--primary-dark); }
    .btn-checkout:disabled { background: #ccc; cursor: not-allowed; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.52);
      z-index: 3000; display: flex; align-items: center; justify-content: center;
      padding: 1rem; opacity: 0; visibility: hidden; transition: all 0.25s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: #fff; border-radius: 20px; max-width: 500px; width: 100%;
      max-height: 90vh; overflow-y: auto; transform: scale(0.92); transition: transform 0.25s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-img { width: 100%; height: 280px; object-fit: cover; border-radius: 20px 20px 0 0; }
    .modal-body { padding: 1.3rem; }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; }
    .modal-price { font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 0.7rem; }
    .modal-desc { color: var(--text-light); margin-bottom: 1.15rem; line-height: 1.7; }
    .modal-actions { display: flex; gap: 0.7rem; }
    .btn-primary {
      flex: 1; padding: 0.75rem; background: var(--primary); color: #fff;
      border: none; border-radius: 50px; font-family: inherit; font-weight: 700; cursor: pointer;
    }
    .btn-secondary {
      flex: 1; padding: 0.75rem; background: #fff; color: var(--primary);
      border: 2px solid var(--primary); border-radius: 50px;
      font-family: inherit; font-weight: 700; cursor: pointer;
    }
    footer {
      background: var(--primary-dark); color: rgba(255,255,255,0.85);
      text-align: center; padding: 1.6rem 1rem; font-size: 0.88rem;
    }
    .toast {
      position: fixed; bottom: 1.8rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary-dark); color: #fff;
      padding: 0.75rem 1.5rem; border-radius: 50px;
      font-weight: 600; z-index: 4000; opacity: 0;
      transition: all 0.3s; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .no-results {
      text-align: center; padding: 4rem 1rem; color: var(--text-light); grid-column: 1 / -1;
    }
    .no-results span { font-size: 2.8rem; display: block; margin-bottom: 0.9rem; }
    @media (max-width: 600px) {
      .header-inner { gap: 0.6rem; }
      .search-box { order: 3; max-width: 100%; width: 100%; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 0.9rem; }
      .product-img { height: 165px; }
      .product-body { padding: 0.75rem; }
      .product-title { font-size: 0.88rem; }
      .btn-add { padding: 0.42rem 0.65rem; font-size: 0.78rem; }
    }
    [dir="ltr"] .search-box input { padding: 0.7rem 2.7rem 0.7rem 1rem; }
    [dir="ltr"] .search-box .icon { right: auto; left: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo" onclick="resetFilters(); return false;">
        <div class="logo-icon">💜</div>
        <span id="logo-text">متجر بنفسج</span>
      </a>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="ابحث عن منتج..." oninput="filterProducts()" />
      </div>
      <div class="header-actions">
        <button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
        <button class="cart-btn" onclick="openCart()">
          🛒 <span id="cartLabel">السلة</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h1 id="heroTitle">أهلاً بك في متجر بنفسج</h1>
    <p id="heroDesc">أزياء • إلكترونيات • عطور وتجميل • إكسسوارات — للرجال والنساء بأفضل الأسعار</p>
  </section>

  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="all" onclick="setCategory('all')">الكل</button>
    <button class="cat-btn" data-cat="fashion" onclick="setCategory('fashion')">أزياء</button>
    <button class="cat-btn" data-cat="electronics" onclick="setCategory('electronics')">إلكترونيات</button>
    <button class="cat-btn" data-cat="beauty" onclick="setCategory('beauty')">عطور وتجميل</button>
    <button class="cat-btn" data-cat="accessories" onclick="setCategory('accessories')">إكسسوارات</button>
  </div>

  <main class="container">
    <h2 class="section-title" id="sectionTitle">🔥 المنتجات المميزة</h2>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div class="cart-overlay" id="cartOverlay" onclick="closeCart(event)">
    <div class="cart-sidebar" onclick="event.stopPropagation()">
      <div class="cart-header">
        <h2 id="cartTitle">سلة التسوق</h2>
        <button class="close-cart" onclick="closeCart()">×</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span id="totalLabel">الإجمالي</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button class="btn-checkout" id="checkoutBtn" onclick="checkout()" disabled>إتمام الطلب</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <img class="modal-img" id="modalImg" src="" alt="" />
      <div class="modal-body">
        <div class="product-cat" id="modalCat"></div>
        <h3 class="modal-title" id="modalTitle"></h3>
        <div class="modal-price" id="modalPrice"></div>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-actions">
          <button class="btn-primary" id="modalAddBtn" onclick="addFromModal()">أضف إلى السلة</button>
          <button class="btn-secondary" id="modalBuyBtn" onclick="buyNow()">اشتري الآن</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <p id="footerText">جميع الحقوق محفوظة © 2026 — متجر بنفسج | Banafsaj Store</p>
  </footer>

<script>
    // ===================== 1. إعدادات الأفلييت والمتغيرات =====================
    const AFFILIATE_TRACKING = "ismg_ol=FgiHU90Jmtk_01_KOC-C";
    let products = [];
    let currentCategory = 'all';
    let currentLang = 'ar'; // اللغة الافتراضية
    let cart = JSON.parse(localStorage.getItem('banafsaj_cart_v4') || '[]');
    let selectedProduct = null;

    // ===================== 2. تحميل المنتجات من JSON =====================
    async function loadProducts() {
      try {
        const response = await fetch('products.json');
        if (!response.ok) throw new Error('File not found');
        const data = await response.json();
        
        products = data.map((item, index) => {
          let url = item.url || "";
          // حقن كود التتبع تلقائياً
          if (url && !url.includes(AFFILIATE_TRACKING)) {
            url = url + (url.includes('?') ? '&' : '?') + AFFILIATE_TRACKING;
          }
          return {
            id: item.id || index,
            name_ar: item.name_ar || "منتج",
            name_en: item.name_en || "Product",
            desc_ar: item.desc_ar || "منتج مميز",
            desc_en: item.desc_en || "",
            price: parseFloat(item.price) || 0,
            category: item.category || "fashion",
            image: item.image || "",
            affiliateUrl: url
          };
        });

        renderProducts();
        updateCartUI();
      } catch (error) {
        console.error("خطأ في تحميل المنتجات:", error);
        document.getElementById('productsGrid').innerHTML = `<p style="text-align:center; color:red; font-weight:bold; grid-column: 1/-1;">حدث خطأ في تحميل المنتجات. تأكد من وجود ملف products.json في نفس المجلد.</p>`;
      }
    }

    // ===================== 3. عرض المنتجات =====================
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = products.filter(p => {
        const matchCat = currentCategory === 'all' || p.category === currentCategory;
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        const desc = currentLang === 'ar' ? p.desc_ar : p.desc_en;
        const matchSearch = !search || name.toLowerCase().includes(search) || desc.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px;"><h2>لا توجد منتجات مطابقة</h2></div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        const catName = getCategoryName(p.category);
        return `
          <article class="product-card" onclick="openModal(${p.id})">
            <img class="product-img" src="${p.image}" alt="${name}" loading="lazy" onerror="this.src='https://placehold.co/500x600/6B2D7B/ffffff?text=Banafsaj'" />
            <div class="product-body">
              <div class="product-cat">${catName}</div>
              <h3 class="product-title">${name}</h3>
              <div class="product-footer">
                <div class="product-price">$${p.price.toFixed(2)}</div>
                <button class="btn-add" onclick="event.stopPropagation(); addToCart(${p.id})">
                  ${currentLang === 'ar' ? 'أضف للسلة' : 'Add'}
                </button>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    function getCategoryName(cat) {
      const names = {
        fashion: currentLang === 'ar' ? 'أزياء' : 'Fashion',
        electronics: currentLang === 'ar' ? 'إلكترونيات' : 'Electronics',
        beauty: currentLang === 'ar' ? 'عطور وتجميل' : 'Beauty',
        accessories: currentLang === 'ar' ? 'إكسسوارات' : 'Accessories',
        home: currentLang === 'ar' ? 'منزل' : 'Home'
      };
      return names[cat] || cat;
    }

    // ===================== 4. إدارة السلة =====================
    function saveCart() {
      localStorage.setItem('banafsaj_cart_v4', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').textContent = count;
      const container = document.getElementById('cartItems');
      const checkoutBtn = document.getElementById('checkoutBtn');

      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-empty">${currentLang === 'ar' ? 'سلتك فارغة' : 'Cart is empty'}</div>`;
        document.getElementById('cartTotal').textContent = '$0.00';
        checkoutBtn.disabled = true;
        return;
      }

      checkoutBtn.disabled = false;
      let total = 0;
      container.innerHTML = cart.map(item => {
        const p = products.find(prod => prod.id === item.id);
        if (!p) return '';
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        total += p.price * item.qty;
        return `
          <div class="cart-item">
            <img src="${p.image}" alt="${name}" />
            <div class="cart-item-info">
              <div class="cart-item-title">${name}</div>
              <div class="cart-item-price">$${p.price.toFixed(2)}</div>
              <div class="cart-item-actions">
                <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                <button class="remove-btn" onclick="removeFromCart(${p.id})">${currentLang === 'ar' ? 'حذف' : 'Remove'}</button>
              </div>
            </div>
          </div>`;
      }).join('');
      document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ id, qty: 1 });
      saveCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function openCart() {
      document.getElementById('cartOverlay').classList.add('open');
      updateCartUI();
    }

    function closeCart(e) {
      if (e && e.target !== document.getElementById('cartOverlay') && e.type === 'click') return;
      document.getElementById('cartOverlay').classList.remove('open');
    }

    // ===================== 5. إتمام الطلب =====================
    function checkout() {
      if (cart.length === 0) return;
      const ok = confirm(currentLang === 'ar' ? "هام: أتمم الشراء عبر متصفح الويب (وليس تطبيق شي إن). هل تريد المتابعة؟" : "Important: Complete purchase via web browser. Continue?");
      if (!ok) return;
      
      cart.forEach((item, index) => {
        const p = products.find(prod => prod.id === item.id);
        if (p && p.affiliateUrl) {
          setTimeout(() => window.open(p.affiliateUrl, '_blank'), index * 350);
        }
      });
      setTimeout(() => {
        cart = [];
        saveCart();
        closeCart();
      }, cart.length * 350 + 400);
    }

    // ===================== 6. النافذة المنبثقة (Modal) =====================
    function openModal(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;
      const p = selectedProduct;
      document.getElementById('modalImg').src = p.image;
      document.getElementById('modalCat').textContent = getCategoryName(p.category);
      document.getElementById('modalTitle').textContent = currentLang === 'ar' ? p.name_ar : p.name_en;
      document.getElementById('modalPrice').textContent = '$' + p.price.toFixed(2);
      document.getElementById('modalDesc').textContent = currentLang === 'ar' ? p.desc_ar : p.desc_en;
      document.getElementById('modalAddBtn').textContent = currentLang === 'ar' ? 'أضف إلى السلة' : 'Add to Cart';
      document.getElementById('modalBuyBtn').textContent = currentLang === 'ar' ? 'اشتري الآن' : 'Buy Now';
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay') && e.type === 'click') return;
      document.getElementById('modalOverlay').classList.remove('open');
      selectedProduct = null;
    }

    function addFromModal() {
      if (selectedProduct) { addToCart(selectedProduct.id); closeModal(); }
    }

    function buyNow() {
      if (selectedProduct && selectedProduct.affiliateUrl) {
        window.open(selectedProduct.affiliateUrl, '_blank');
        closeModal();
      }
    }

    // ===================== 7. الفلاتر واللغة =====================
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      renderProducts();
    }

    function filterProducts() { renderProducts(); }

    // ===================== 8. التشغيل =====================
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts(); 
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCart(); closeModal(); }
    });
  </script>
</body>
</html>

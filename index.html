<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر بنفسج | Banafsaj Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- ربط ملف المنتجات الجديد -->
  <script src="products.js"></script>
  <style>
    :root {
      --primary: #6B2D7B; --primary-dark: #4A1C55; --primary-light: #9B4DB0;
      --bg: #F8F5FA; --card: #FFFFFF; --text: #2D1B36; --text-light: #6B5B73;
      --border: #E8DFF0; --shadow: 0 4px 24px rgba(107, 45, 123, 0.09); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 0.75rem 1.2rem; position: sticky; top: 0; z-index: 1000; }
    .header-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 0.55rem; font-size: 1.45rem; font-weight: 800; text-decoration: none; color: #fff; }
    .logo-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .search-box { flex: 1; min-width: 180px; max-width: 460px; position: relative; }
    .search-box input { width: 100%; padding: 0.7rem 1rem; border: none; border-radius: 50px; font-family: inherit; outline: none; }
    .header-actions { display: flex; align-items: center; gap: 0.7rem; }
    .cart-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.5rem 0.95rem; border-radius: 50px; cursor: pointer; font-family: inherit; position: relative; }
    .cart-count { position: absolute; top: -7px; left: -7px; background: #FF4081; color: #fff; font-size: 0.68rem; font-weight: 700; width: 19px; height: 19px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .hero { background: linear-gradient(135deg, #8B3A9B 0%, #5A1F6A 100%); color: #fff; padding: 2.2rem 1.2rem; text-align: center; }
    .categories { max-width: 1280px; margin: 1.4rem auto 0; padding: 0 1.2rem; display: flex; gap: 0.55rem; overflow-x: auto; }
    .cat-btn { flex-shrink: 0; padding: 0.5rem 1.15rem; border-radius: 50px; border: 2px solid var(--border); background: #fff; font-family: inherit; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .container { max-width: 1280px; margin: 0 auto; padding: 1.4rem 1.2rem 3.5rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.3rem; }
    .product-card { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 230px; object-fit: cover; }
    .product-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .product-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.5rem; height: 2.7em; overflow: hidden; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .product-price { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
    .btn-add { background: var(--primary); color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 50px; cursor: pointer; font-family: inherit; }
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; }
    .cart-overlay.open { display: block; }
    .cart-sidebar { position: fixed; top: 0; left: 0; width: 350px; height: 100%; background: #fff; z-index: 2001; transform: translateX(-100%); transition: 0.3s; display: flex; flex-direction: column; }
    .cart-overlay.open .cart-sidebar { transform: translateX(0); }
    .cart-header { background: var(--primary); color: #fff; padding: 1rem; display: flex; justify-content: space-between; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
    .cart-footer { padding: 1rem; border-top: 1px solid var(--border); }
    .btn-checkout { width: 100%; padding: 1rem; background: var(--primary); color: #fff; border: none; border-radius: 50px; cursor: pointer; font-weight: 700; }
    footer { background: var(--primary-dark); color: #fff; text-align: center; padding: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo" onclick="resetFilters(); return false;"><div class="logo-icon">💜</div><span>متجر بنفسج</span></a>
      <div class="search-box"><input type="text" id="searchInput" placeholder="ابحث..." oninput="renderProducts()" /></div>
      <div class="header-actions">
        <button class="cart-btn" onclick="openCart()">🛒 <span class="cart-count" id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <section class="hero"><h1>أهلاً بك في متجر بنفسج</h1></section>

  <div class="categories" id="categories">
    <button class="cat-btn active" data-cat="all" onclick="setCategory('all')">الكل</button>
    <button class="cat-btn" data-cat="fashion" onclick="setCategory('fashion')">أزياء</button>
    <button class="cat-btn" data-cat="electronics" onclick="setCategory('electronics')">إلكترونيات</button>
    <button class="cat-btn" data-cat="accessories" onclick="setCategory('accessories')">إكسسوارات</button>
    <button class="cat-btn" data-cat="home" onclick="setCategory('home')">منزل</button>
  </div>

  <main class="container">
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <div class="cart-overlay" id="cartOverlay" onclick="closeCart(event)">
    <div class="cart-sidebar" onclick="event.stopPropagation()">
      <div class="cart-header"><h2>السلة</h2><button onclick="closeCart()" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">×</button></div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold;"><span>الإجمالي:</span><span id="cartTotal">$0.00</span></div>
        <button class="btn-checkout" onclick="checkout()">إتمام الطلب</button>
      </div>
    </div>
  </div>

  <footer><p>جميع الحقوق محفوظة © 2026 — متجر بنفسج</p></footer>

  <script>
    const AFFILIATE_TRACKING = "ismg_ol=FgiHU90Jmtk_01_KOC-C";
    let products = [];
    let currentCategory = 'all';
    let cart = JSON.parse(localStorage.getItem('banafsaj_cart_v5') || '[]');

    // دالة التشغيل (تقرأ من myProducts الموجودة في ملف products.js)
    function loadProducts() {
      if (typeof myProducts !== 'undefined') {
        products = myProducts.map(item => {
          let url = item.url || "";
          if (url && !url.includes(AFFILIATE_TRACKING)) {
            url = url + (url.includes('?') ? '&' : '?') + AFFILIATE_TRACKING;
          }
          return { ...item, affiliateUrl: url };
        });
        renderProducts();
        updateCartUI();
      } else {
        document.getElementById('productsGrid').innerHTML = "<p style='text-align:center; color:red; grid-column:1/-1;'>ملف المنتجات غير موجود.</p>";
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = products.filter(p => {
        const matchCat = currentCategory === 'all' || p.category === currentCategory;
        const matchSearch = p.name_ar.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });
      if (filtered.length === 0) { grid.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>لا توجد منتجات.</p>"; return; }
      grid.innerHTML = filtered.map(p => `
        <article class="product-card">
          <img class="product-img" src="${p.image}" loading="lazy">
          <div class="product-body">
            <div class="product-title">${p.name_ar}</div>
            <div class="product-footer">
              <div class="product-price">$${p.price.toFixed(2)}</div>
              <button class="btn-add" onclick="addToCart(${p.id})">أضف</button>
            </div>
          </div>
        </article>`).join('');
    }

    function setCategory(cat) { currentCategory = cat; document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.cat === cat)); renderProducts(); }
    function addToCart(id) { const existing = cart.find(item => item.id === id); if (existing) existing.qty += 1; else cart.push({ id, qty: 1 }); saveCart(); }
    function saveCart() { localStorage.setItem('banafsaj_cart_v5', JSON.stringify(cart)); updateCartUI(); }
    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').textContent = count;
      let total = 0;
      document.getElementById('cartItems').innerHTML = cart.map(item => {
        const p = products.find(prod => prod.id === item.id);
        if (!p) return '';
        total += p.price * item.qty;
        return `<div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;">
                  <span>${p.name_ar.substring(0,20)}... (x${item.qty})</span>
                  <span>$${(p.price * item.qty).toFixed(2)}</button>
                </div>`;
      }).join('');
      document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
    }
    function openCart() { document.getElementById('cartOverlay').classList.add('open'); }
    function closeCart(e) { if (e && e.target !== document.getElementById('cartOverlay')) return; document.getElementById('cartOverlay').classList.remove('open'); }
    function checkout() {
      if (cart.length === 0) return;
      cart.forEach(item => { const p = products.find(prod => prod.id === item.id); if (p && p.affiliateUrl) window.open(p.affiliateUrl, '_blank'); });
      cart = []; saveCart(); closeCart();
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>

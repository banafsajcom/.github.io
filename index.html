    ];

    // ===================== STATE =====================
    let currentLang = 'ar';
    let currentCategory = 'all';
    let cart = JSON.parse(localStorage.getItem('banafsaj_cart_v3') || '[]');
    let selectedProduct = null;
    let imageCache = {};

    // ===================== دوال جلب الصور الحقيقية =====================
    async function fetchRealImage(productUrl) {
      if (!USE_REAL_IMAGES || APIFY_TOKEN === "YOUR_APIFY_API_TOKEN_HERE") return null;
      if (imageCache[productUrl]) return imageCache[productUrl];
      try {
        const response = await fetch(`https://api.apify.com/v2/acts/khadinakbar~shein-product-scraper/run-sync-get-dataset-items?token=${APIFY_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            "startUrls": [{ "url": productUrl }],
            "maxItems": 1,
            "scrapeProductDetails": true,
            "proxyConfiguration": { "useApifyProxy": true }
          })
        });
        if (!response.ok) throw new Error(`Apify request failed: ${response.status}`);
        const items = await response.json();
        if (items && items.length > 0) {
          const firstItem = items[0];
          const imageUrl = firstItem.mainImage || (firstItem.images && firstItem.images.length > 0 ? firstItem.images[0] : null);
          if (imageUrl) {
            imageCache[productUrl] = imageUrl;
            return imageUrl;
          }
        }
        return null;
      } catch (error) {
        console.warn("Could not fetch real image for:", productUrl, error);
        return null;
      }
    }

    // ===================== RENDER =====================
    async function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = products.filter(p => {
        const matchCat = currentCategory === 'all' || p.category === currentCategory;
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        const desc = currentLang === 'ar' ? p.desc_ar : p.desc_en;
        const matchSearch = !search || name.toLowerCase().includes(search) || desc.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results"><span>🔍</span><p>${currentLang === 'ar' ? 'لا توجد منتجات مطابقة لبحثك' : 'No products match your search'}</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(p => {
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        const desc = currentLang === 'ar' ? p.desc_ar : p.desc_en;
        const catName = getCategoryName(p.category);
        return `
          <article class="product-card" onclick="openModal(${p.id})">
            <img class="product-img" src="${p.image}" alt="${name}" loading="lazy" data-product-id="${p.id}" onerror="this.src='https://placehold.co/500x600/6B2D7B/ffffff?text=Banafsaj'" />
            <div class="product-body">
              <div class="product-cat">${catName}</div>
              <h3 class="product-title">${name}</h3>
              <p class="product-desc">${desc}</p>
              <div class="product-footer">
                <div class="product-price">$${p.price.toFixed(2)}</div>
                <button class="btn-add" onclick="event.stopPropagation(); addToCart(${p.id})">${currentLang === 'ar' ? 'أضف للسلة' : 'Add to Cart'}</button>
              </div>
            </div>
          </article>`;
      }).join('');
      if (USE_REAL_IMAGES) {
        filtered.forEach(async (product) => {
          const realImageUrl = await fetchRealImage(product.affiliateUrl);
          if (realImageUrl) {
            const imgElement = document.querySelector(`img[data-product-id="${product.id}"]`);
            if (imgElement) imgElement.src = realImageUrl;
          }
        });
      }
    }

    function getCategoryName(cat) {
      const names = {
        fashion: currentLang === 'ar' ? 'أزياء' : 'Fashion',
        electronics: currentLang === 'ar' ? 'إلكترونيات' : 'Electronics',
        beauty: currentLang === 'ar' ? 'عطور وتجميل' : 'Beauty & Perfume',
        accessories: currentLang === 'ar' ? 'إكسسوارات' : 'Accessories'
      };
      return names[cat] || cat;
    }

    // ===================== CART =====================
    function saveCart() {
      localStorage.setItem('banafsaj_cart_v3', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').textContent = count;
      const container = document.getElementById('cartItems');
      const checkoutBtn = document.getElementById('checkoutBtn');
      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-empty">${currentLang === 'ar' ? 'سلتك فارغة حالياً' : 'Your cart is empty'}</div>`;
        document.getElementById('cartTotal').textContent = '$0.00';
        checkoutBtn.disabled = true;
        return;
      }
      checkoutBtn.disabled = false;
      let total = 0;
      container.innerHTML = cart.map(item => {
        const p = products.find(prod => prod.id === item.id);
        if (!p) return '';
        const name = currentLang === 'ar' ? p.name_ar : p.name_en;
        total += p.price * item.qty;
        return `
          <div class="cart-item">
            <img src="${p.image}" alt="${name}" onerror="this.src='https://placehold.co/100x100/6B2D7B/ffffff?text=+'" />
            <div class="cart-item-info">
              <div class="cart-item-title">${name}</div>
              <div class="cart-item-price">$${p.price.toFixed(2)}</div>
              <div class="cart-item-actions">
                <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                <button class="remove-btn" onclick="removeFromCart(${p.id})">${currentLang === 'ar' ? 'حذف' : 'Remove'}</button>
              </div>
            </div>
          </div>`;
      }).join('');
      document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ id, qty: 1 });
      saveCart();
      showToast(currentLang === 'ar' ? 'تمت الإضافة إلى السلة 💜' : 'Added to cart 💜');
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function openCart() {
      document.getElementById('cartOverlay').classList.add('open');
      updateCartUI();
    }

    function closeCart(e) {
      if (e && e.target !== document.getElementById('cartOverlay') && e.type === 'click') return;
      document.getElementById('cartOverlay').classList.remove('open');
    }

    // ===================== CHECKOUT =====================
    function checkout() {
      if (cart.length === 0) return;
      const userConfirmed = confirm(currentLang === 'ar' 
        ? "هام: لضمان احتساب طلبك، يرجى إتمام عملية الشراء من خلال متصفح الويب (وليس تطبيق Shein). هل أنت مستعد للمتابعة؟"
        : "Important: To ensure your order is tracked, please complete your purchase through the web browser (not the Shein app). Are you ready to continue?"
      );
      if (!userConfirmed) return;
      cart.forEach((item, index) => {
        const p = products.find(prod => prod.id === item.id);
        if (p && p.affiliateUrl) {
          setTimeout(() => window.open(p.affiliateUrl, '_blank', 'noopener,noreferrer'), index * 350);
        }
      });
      setTimeout(() => {
        showToast(currentLang === 'ar' 
          ? `تذكير: استخدم كود الخصم "${UNIQUE_COUPON_CODE}" عند إتمام الطلب لتأكيد تتبع العمولة.` 
          : `Reminder: Use coupon code "${UNIQUE_COUPON_CODE}" at checkout to ensure commission tracking.`
        );
      }, 1000);
      setTimeout(() => {
        cart = [];
        saveCart();
        closeCart();
      }, cart.length * 350 + 400);
    }

    // ===================== MODAL =====================
    function openModal(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;
      const p = selectedProduct;
      document.getElementById('modalImg').src = p.image;
      document.getElementById('modalCat').textContent = getCategoryName(p.category);
      document.getElementById('modalTitle').textContent = currentLang === 'ar' ? p.name_ar : p.name_en;
      document.getElementById('modalPrice').textContent = '$' + p.price.toFixed(2);
      document.getElementById('modalDesc').textContent = currentLang === 'ar' ? p.desc_ar : p.desc_en;
      document.getElementById('modalAddBtn').textContent = currentLang === 'ar' ? 'أضف إلى السلة' : 'Add to Cart';
      document.getElementById('modalBuyBtn').textContent = currentLang === 'ar' ? 'اشتري الآن' : 'Buy Now';
      document.getElementById('modalOverlay').classList.add('open');
      if (USE_REAL_IMAGES) {
        fetchRealImage(p.affiliateUrl).then(realUrl => {
          if (realUrl) document.getElementById('modalImg').src = realUrl;
        });
      }
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay') && e.type === 'click') return;
      document.getElementById('modalOverlay').classList.remove('open');
      selectedProduct = null;
    }

    function addFromModal() {
      if (selectedProduct) { addToCart(selectedProduct.id); closeModal(); }
    }

    function buyNow() {
      if (selectedProduct && selectedProduct.affiliateUrl) {
        const userConfirmed = confirm(currentLang === 'ar' 
          ? "هام: لضمان احتساب طلبك، يرجى إتمام عملية الشراء من خلال متصفح الويب (وليس تطبيق Shein). هل أنت مستعد للمتابعة؟"
          : "Important: To ensure your order is tracked, please complete your purchase through the web browser (not the Shein app). Are you ready to continue?"
        );
        if (!userConfirmed) return;
        window.open(selectedProduct.affiliateUrl, '_blank', 'noopener,noreferrer');
        showToast(currentLang === 'ar' 
          ? `تذكير: استخدم كود الخصم "${UNIQUE_COUPON_CODE}" عند إتمام الطلب.` 
          : `Reminder: Use coupon code "${UNIQUE_COUPON_CODE}" at checkout.`
        );
        closeModal();
      }
    }

    // ===================== FILTERS =====================
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      renderProducts();
    }

    function filterProducts() { renderProducts(); }

    function resetFilters() {
      currentCategory = 'all';
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === 'all');
      });
      renderProducts();
    }

    // ===================== LANGUAGE =====================
    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const html = document.documentElement;
      if (currentLang === 'en') {

        document.getElementById('totalLabel').textContent = 'Total';
        document.getElementById('checkoutBtn').textContent = 'Checkout';
        document.getElementById('footerText').textContent = 'All Rights Reserved © 2026 — Banafsaj Store';

        document.querySelectorAll('.cat-btn').forEach((btn, i) => btn.textContent = enCats[i]);

        html.setAttribute('lang', 'ar');

        document.getElementById('logo-text').textContent = 'متجر بنفسج';

        document.getElementById('heroDesc').textContent = 'أزياء • إلكترونيات • عطور وتجميل • إكسسوارات — للرجال والنساء بأفضل الأسعار';
        document.getElementById('sectionTitle').textContent = '🔥 المنتجات المميزة';
        document.getElementById('searchInput').placeholder = 'ابحث عن منتج...';
        document.getElementById('langBtn').textContent = 'English';
        document.getElementById('cartLabel').textContent = 'السلة';
        document.getElementById('cartTitle').textContent = 'سلة التسوق';
        document.getElementById('totalLabel').textContent = 'الإجمالي';
        document.getElementById('checkoutBtn').textContent = 'إتمام الطلب';
        document.getElementById('footerText').textContent = 'جميع الحقوق محفوظة © 2026 — متجر بنفسج | Banafsaj Store';
        const arCats = ['الكل', 'أزياء', 'إلكترونيات', 'عطور وتجميل', 'إكسسوارات'];
        document.querySelectorAll('.cat-btn').forEach((btn, i) => btn.textContent = arCats[i]);
      }
      renderProducts();
      updateCartUI();
    }

    // ===================== TOAST =====================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();
      updateCartUI();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCart(); closeModal(); }
    });

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--primary-dark); color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 250px; object-fit: cover; }
    .product-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .product-title { font-weight: bold; margin-bottom: 0.5rem; height: 3rem; overflow: hidden; font-size: 0.9rem; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .product-price { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-family: inherit; }

    // دالة العرض
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      
      grid.innerHTML = myProducts.map(p => {
        // إضافة كود التتبع للرابط
        let finalUrl = p.url;
        if (!finalUrl.includes(AFFILIATE_TRACKING)) {
            finalUrl = finalUrl + (finalUrl.includes('?') ? '&' : '?') + AFFILIATE_TRACKING;
        }

        return `
          <div class="product-card">
            <img class="product-img" src="${p.image}" loading="lazy" onerror="this.src='https://placehold.co/250x250?text=Banafsaj'">
            <div class="product-body">
              <div class="product-title">${p.name_ar}</div>
              <div class="product-footer">
                <div class="product-price">$${p.price}</div>
                <a href="${finalUrl}" target="_blank" style="text-decoration:none;">
                  <button class="btn">اشتري الآن</button>
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // تشغيل الدالة عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', renderProducts);
